<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Life Organizer - Calendar (Neo-Brutalist)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Space Grotesk', sans-serif;
            background: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* iPhone Frame */
        .iphone-frame {
            width: 430px;
            height: 932px;
            background: #000;
            border-radius: 60px;
            padding: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            position: relative;
        }

        .notch {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 150px;
            height: 30px;
            background: #000;
            border-radius: 0 0 20px 20px;
            z-index: 10;
        }

        .screen {
            width: 100%;
            height: 100%;
            background: #f5f5f4;
            border-radius: 45px;
            overflow: hidden;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        .header {
            background: #ffffff;
            border-bottom: 2px solid #111827;
            padding: 50px 20px 16px 20px;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .logo {
            font-size: 20px;
            font-weight: 700;
            color: #111827;
            text-transform: uppercase;
            letter-spacing: -0.5px;
        }

        .header-icons {
            display: flex;
            gap: 8px;
        }

        .icon-btn {
            width: 36px;
            height: 36px;
            background: #ffffff;
            border: 2px solid #111827;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 18px;
            transition: all 0.2s;
        }

        .icon-btn:hover {
            box-shadow: 3px 3px 0 #111827;
            transform: translate(-2px, -2px);
        }

        .welcome-text {
            font-size: 13px;
            color: #6b7280;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Content Area */
        .content {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            padding-bottom: 80px;
        }

        /* Month Navigation */
        .month-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .month-year {
            font-size: 24px;
            font-weight: 700;
            color: #111827;
            text-transform: uppercase;
        }

        .nav-arrows {
            display: flex;
            gap: 8px;
        }

        .arrow-btn {
            width: 40px;
            height: 40px;
            background: #ffffff;
            border: 2px solid #111827;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 18px;
            font-weight: 700;
            transition: all 0.2s;
        }

        .arrow-btn:hover {
            box-shadow: 3px 3px 0 #111827;
            transform: translate(-2px, -2px);
        }

        /* View Toggle */
        .view-toggle {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
        }

        .toggle-btn {
            flex: 1;
            padding: 10px;
            background: #ffffff;
            border: 2px solid #111827;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .toggle-btn.active {
            background: #111827;
            color: #ffffff;
        }

        .toggle-btn:not(.active):hover {
            box-shadow: 3px 3px 0 #111827;
            transform: translate(-2px, -2px);
        }

        /* Calendar */
        .calendar-card {
            background: #ffffff;
            border: 2px solid #111827;
            padding: 16px;
            margin-bottom: 20px;
        }

        .day-headers {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            margin-bottom: 8px;
        }

        .day-header {
            text-align: center;
            font-size: 10px;
            font-weight: 700;
            color: #6b7280;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 8px 0;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
        }

        .calendar-day {
            aspect-ratio: 1;
            border: 2px solid #111827;
            background: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            position: relative;
            transition: all 0.2s;
        }

        .calendar-day:hover {
            box-shadow: 2px 2px 0 #111827;
            transform: translate(-1px, -1px);
        }

        .calendar-day.other-month {
            background: #f5f5f4;
            border-color: #d1d5db;
        }

        .calendar-day.other-month .day-number {
            color: #9ca3af;
        }

        .calendar-day.today {
            border-color: #0ea5e9;
            border-width: 3px;
        }

        .calendar-day.selected {
            background: #111827;
        }

        .calendar-day.selected .day-number {
            color: #ffffff;
        }

        .day-number {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 14px;
            font-weight: 600;
            color: #111827;
            margin-bottom: 4px;
        }

        .event-dots {
            display: flex;
            gap: 2px;
        }

        .event-dot {
            width: 4px;
            height: 4px;
            border-radius: 50%;
        }

        .event-dot.red { background: #ef4444; }
        .event-dot.blue { background: #0ea5e9; }
        .event-dot.green { background: #22c55e; }
        .event-dot.amber { background: #fbbf24; }
        .event-dot.pink { background: #EC4899; }

        /* Selected Day Events */
        .selected-day-header {
            font-size: 16px;
            font-weight: 700;
            color: #111827;
            text-transform: uppercase;
            margin-bottom: 12px;
            letter-spacing: 0.5px;
        }

        .event-card {
            background: #ffffff;
            border: 2px solid #111827;
            padding: 12px;
            margin-bottom: 8px;
            display: flex;
            gap: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .event-card:hover {
            box-shadow: 3px 3px 0 #111827;
            transform: translate(-2px, -2px);
        }

        .event-time {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 12px;
            font-weight: 600;
            color: #111827;
            min-width: 60px;
        }

        .event-details {
            flex: 1;
        }

        .event-title {
            font-size: 14px;
            font-weight: 600;
            color: #111827;
            margin-bottom: 4px;
        }

        .event-category {
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: inline-block;
            padding: 2px 6px;
            border: 1px solid #111827;
        }

        .event-category.work { background: #ef4444; color: #ffffff; border-color: #ef4444; }
        .event-category.personal { background: #0ea5e9; color: #ffffff; border-color: #0ea5e9; }
        .event-category.health { background: #22c55e; color: #ffffff; border-color: #22c55e; }
        .event-category.shopping { background: #fbbf24; color: #111827; border-color: #fbbf24; }
        .event-category.birthday { background: #EC4899; color: #ffffff; border-color: #EC4899; }

        /* FAB */
        .fab {
            position: fixed;
            bottom: 90px;
            right: calc(50% - 215px + 20px);
            width: 56px;
            height: 56px;
            background: #0ea5e9;
            border: 2px solid #111827;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            color: #ffffff;
            cursor: pointer;
            box-shadow: 4px 4px 0 #111827;
            transition: all 0.2s;
            z-index: 5;
        }

        .fab:hover {
            box-shadow: 6px 6px 0 #111827;
            transform: translate(-2px, -2px);
        }

        /* Bottom Tab Bar */
        .tab-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: #111827;
            border-top: 2px solid #111827;
            display: flex;
            justify-content: space-around;
            padding: 12px 0 20px 0;
        }

        .tab {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            transition: all 0.2s;
            opacity: 0.5;
        }

        .tab.active {
            opacity: 1;
        }

        .tab-icon {
            font-size: 24px;
            color: #ffffff;
        }

        .tab.active .tab-icon {
            color: #0ea5e9;
        }

        .tab-label {
            font-size: 10px;
            font-weight: 600;
            color: #ffffff;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .tab.active .tab-label {
            color: #0ea5e9;
        }

        /* Scrollbar */
        .content::-webkit-scrollbar {
            width: 6px;
        }

        .content::-webkit-scrollbar-track {
            background: #e5e7eb;
        }

        .content::-webkit-scrollbar-thumb {
            background: #111827;
            border: 1px solid #111827;
        }
    </style>
</head>
<body>

    <script>
        // Calendar day click interaction
        document.querySelectorAll('.calendar-day:not(.other-month)').forEach(day => {
            day.addEventListener('click', function() {
                // Remove selected class from all days
                document.querySelectorAll('.calendar-day').forEach(d => d.classList.remove('selected'));
                // Add selected class to clicked day
                this.classList.add('selected');
            });
        });

        // View toggle
        document.querySelectorAll('.toggle-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.toggle-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
            });
        });

        // Tab navigation
        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', function() {
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                this.classList.add('active');
            });
        });

        // FAB click
        document.querySelector('.fab').addEventListener('click', function() {
            alert('Add new event functionality would open here');
        });

        // Navigation arrows
        document.querySelectorAll('.arrow-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                // Month navigation would update calendar here
                console.log('Navigate month:', this.textContent);
            });
        });
    </script>
